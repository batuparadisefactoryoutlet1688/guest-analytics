<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Batu Paradise Guest Analytics</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
  }
  .login-header {
    text-align: center;
    margin-bottom: 22px;
  }
  .login-header h1 {
    font-size: 24px;
  }
  .login-header .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
  }
  .login-ridge {
    height: 40px;
    margin-bottom: -1px;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <h1>Batu Paradise</h1>
    <div class="subtitle">Guest Analytics</div>
  </div>

  <svg class="login-ridge" viewBox="0 0 400 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:100%;">
    <path d="M0 34 L40 18 L70 28 L110 8 L150 24 L190 13 L230 29 L270 12 L310 26 L350 17 L400 31" fill="none" stroke="#33513A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </svg>

  <div class="card">
    <div id="loginMessage"></div>
    <form id="loginForm">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" autofocus autocomplete="current-password">
      </div>
      <button type="submit" id="loginSubmit" style="width:100%;">Masuk</button>
    </form>
  </div>

  <div style="text-align:center;margin-top:14px;">
    <a href="dashboard.html" style="font-size:13px;color:var(--muted);text-decoration:underline;">Lihat dashboard tanpa login →</a>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
