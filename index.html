<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batu Paradise Guest Analytics</title>
<link rel="manifest" href="manifest.json">
<script>
  // index.html cuma pintu masuk. Kalau sudah login sebagai ADMIN, langsung ke Input.
  // Kalau tidak, langsung ke Dashboard (bisa dilihat semua orang tanpa login).
  var role = localStorage.getItem('bp_role');
  var token = localStorage.getItem('bp_token');
  window.location.replace((token && role === 'ADMIN') ? 'input.html' : 'dashboard.html');
</script>
</head>
<body></body>
</html>
