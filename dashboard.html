<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Batu Paradise Guest Analytics</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-slot"></aside>

  <main class="main">
    <div class="main-inner">
      <div class="ridge-header">
        <div class="titles">
          <h1>Dashboard</h1>
          <div class="subtitle">Ringkasan tamu hari ini, bulan ini, dan tahun ini</div>
        </div>
        <div class="ridge-svg-slot"></div>
      </div>

      <div id="dashboardMessage"></div>

      <div class="kpi-grid" id="kpiWrap">
        <div class="kpi"><span class="spinner"></span></div>
        <div class="kpi"><span class="spinner"></span></div>
        <div class="kpi"><span class="spinner"></span></div>
      </div>

      <div class="card" style="margin-top:14px;">
        <div class="card-title">Trend 7 Hari Terakhir</div>
        <div class="trend-chart-wrap">
          <canvas id="trendChart"></canvas>
        </div>
      </div>
    </div>
  </main>
</div>

<nav class="bottom-nav" id="bottomnav-slot"></nav>

<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
