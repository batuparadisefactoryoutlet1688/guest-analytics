<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Data — Batu Paradise Guest Analytics</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/input.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-slot"></aside>

  <main class="main">
    <div class="main-inner">
      <div class="ridge-header">
        <div class="titles">
          <h1>Input Data Tamu</h1>
          <div class="subtitle" id="formModeLabel">Mode: Input data baru</div>
        </div>
        <div class="ridge-svg-slot"></div>
      </div>

      <div id="inputMessage"></div>

      <div class="card">
        <form id="inputForm">
          <div class="field">
            <label for="tanggal">Tanggal</label>
            <input type="date" id="tanggal">
          </div>

          <div class="floor-group">
            <div class="floor-title">Lantai 1</div>
            <div class="field-row">
              <div class="field"><label for="l1pagi">Pagi</label><input type="number" id="l1pagi" min="0" placeholder="0"></div>
              <div class="field"><label for="l1sore">Sore</label><input type="number" id="l1sore" min="0" placeholder="0"></div>
            </div>
          </div>

          <div class="floor-group">
            <div class="floor-title">Lantai 2</div>
            <div class="field-row">
              <div class="field"><label for="l2pagi">Pagi</label><input type="number" id="l2pagi" min="0" placeholder="0"></div>
              <div class="field"><label for="l2sore">Sore</label><input type="number" id="l2sore" min="0" placeholder="0"></div>
            </div>
          </div>

          <div class="total-preview">
            <span class="label">Total Tamu</span>
            <span class="value mono" id="totalPreview">0</span>
          </div>

          <div class="field">
            <label for="catatan">Catatan (opsional)</label>
            <textarea id="catatan" rows="2" placeholder="Contoh: hujan seharian, event kantor, dll."></textarea>
          </div>

          <div style="display:flex; gap:10px;">
            <button type="submit" id="submitBtn" style="flex:1;">Simpan Data</button>
            <button type="button" id="deleteBtn" class="danger hidden">Hapus</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="card-title">Data 14 Hari Terakhir</div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th class="num">L1 Pagi</th>
                <th class="num">L1 Sore</th>
                <th class="num">L2 Pagi</th>
                <th class="num">L2 Sore</th>
                <th class="num">Total</th>
              </tr>
            </thead>
            <tbody id="recentDataBody">
              <tr><td colspan="6" class="empty-state"><span class="spinner"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<nav class="bottom-nav" id="bottomnav-slot"></nav>

<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/input.js"></script>
</body>
</html>
